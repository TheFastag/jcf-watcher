name: Check JCF Focalizacion Revamp

on:
  schedule:
    # --- CALENDARIO HISTÓRICO DE APERTURAS DE JCF (Patrón observado, no oficial) ---
    
    # Frecuente: Cada 10 minutos de los días 1 al 15 de meses pares (Feb, Abr, Jun, Ago, Oct, Dic)
    - cron: '*/10 * 1-15 2,4,6,8,10,12 *'
    
    # Espaciado: Cada 30 minutos de los días 16 al 31 de meses pares (Feb, Abr, Jun, Ago, Oct, Dic)
    - cron: '*/30 * 16-31 2,4,6,8,10,12 *'
    
    # Espaciado: Cada 30 minutos todos los días de meses impares (Ene, Mar, May, Jul, Sep, Nov)
    - cron: '*/30 * * 1,3,5,7,9,11 *'
    
  workflow_dispatch: # Habilita ejecución manual desde la pestaña Actions

# Bloqueo de concurrencia para evitar que ejecuciones lentas del sitio JCF se solapen
concurrency:
  group: jcf-checker
  cancel-in-progress: false

permissions:
  contents: write # Requerido para actualizar el caché en data/ y site/

jobs:
  check-status:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: |
        playwright install chromium --with-deps

    - name: Run checker script
      env:
        ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        HEADLESS: "true"
      run: |
        python check_focalizacion.py

    - name: Commit and push status & health changes
      # Se ejecuta incluso si el paso anterior falló (para guardar logs de fallas de salud)
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Agregar archivos generados
        git add data/estados_municipios.json data/salud_checker.json site/data.json 2>/dev/null || true
        
        if ! git diff --cached --quiet; then
          git commit -m "chore: update JCF status & health logs [skip ci]"
          git push
        else
          echo "Sin cambios detectados en el caché ni en logs. Nada que subir."
        fi
